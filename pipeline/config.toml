# Launch Day Alpha pipeline configuration.
# Every tunable value and every assumption about the inputs lives here (PLAN.md sections 4 and 8).

[window]
months_before = 3        # popularity and market window starts this many calendar months before launch
months_after = 6         # ...and ends this many calendar months after launch

[verdict]
day = 30                 # days after launch at which the verdict gap is measured

[market]
# Longest allowed gap, in calendar days, between consecutive closes inside a game's
# window (weekends are 3, long holidays up to about a week). Longer gaps mean missing
# data or a delisting, and the game is excluded rather than carrying a stale price.
max_price_gap_days = 10

[site]
games_per_view = 6       # games picked at random on each page load
popularity_label = "Popularity (launch month = 100)"
currency = "GBP"

[paths]
game_list = "data/games.csv"   # the data teammate's game list
raw_dir = "data/raw"
mock_dir = "data/mock"
output = "site/data/games.json"

# Popularity signals. Names are unknown until the data teammate reports back;
# milestone 2 fills these in for the mock data, milestone 6 for the real data.
# Each signal declares:
#   label        readable name shown on the site
#   weight       relative weight (rescaled over the signals present each month)
#   granularity  "monthly" or "daily"
#   rollup       for daily signals: "sum" (counts) or "mean" (levels)
#
# Example:
# [signals.example_signal]
# label = "Readable name"
# weight = 1.0
# granularity = "monthly"
[signals]

# ---------------------------------------------------------------------------
# Mock data (python -m pipeline.make_mock; used by python -m pipeline.build --mock)
# ---------------------------------------------------------------------------
[mock]
seed = 2026

# Invented signals for placeholder data only. When building with --mock these
# replace [signals]. Same keys as [signals], plus generator-only keys:
#   scale             typical peak value (per month if monthly, per day if daily)
#   starts_at_launch  no rows before launch day (like anything store-based)
#   integer           round values to whole numbers
#   month_format      monthly only: "first_day" (2020-12-01) or "year_month" (2020-12)
[mock.signals.mock_search]
label = "Search interest (mock)"
weight = 0.4
granularity = "monthly"
scale = 100
integer = true
month_format = "first_day"

[mock.signals.mock_reviews]
label = "Store reviews (mock)"
weight = 0.3
granularity = "daily"
rollup = "sum"
scale = 2000
starts_at_launch = true
integer = true

[mock.signals.mock_viewers]
label = "Stream viewers (mock)"
weight = 0.15
granularity = "daily"
rollup = "mean"
scale = 50000
integer = true

[mock.signals.mock_posts]
label = "Forum posts (mock)"
weight = 0.15
granularity = "monthly"
scale = 8000
integer = true
month_format = "year_month"
